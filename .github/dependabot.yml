version: 2
updates:
  # Gradle: gradle/libs.versions.toml, build scripts and the wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      # All minor/patch bumps land in one weekly PR; each major bump gets its own PR.
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # These need compileSdk 37 in every app that uses droid-mcp; the SDK stays on 36 so
      # consumers aren't forced up. Remove once the project moves to compileSdk 37.
      - dependency-name: "androidx.core:*"
        versions: [">= 1.19"]
      - dependency-name: "com.squareup.okhttp3:*"
        versions: [">= 5"]
      # JUnit 6 needs Java 17 bytecode; modules target Java 11 so consumers don't have to.
      - dependency-name: "org.junit.jupiter:*"
        versions: [">= 6"]
      - dependency-name: "org.junit.platform:*"
        versions: [">= 6"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      # gradle/actions v6+ moves caching into a proprietary component under separate
      # Gradle Terms of Use (https://blog.gradle.org/github-actions-for-gradle-v6).
      # Adopting it is a licensing decision, so don't auto-propose it; remove this to opt in.
      - dependency-name: gradle/actions*
        versions: [">= 6"]
