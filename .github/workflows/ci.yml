name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests (all modules, incl. the tool wire-contract snapshot)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Public API check
        run: ./gradlew apiCheck --no-daemon

      # Blocking: any lint issue not recorded in a module's lint-baseline.xml fails CI.
      # --continue so one failing module doesn't hide the others' results.
      - name: Lint
        run: ./gradlew lintDebug --continue --no-daemon

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
